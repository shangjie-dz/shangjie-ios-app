name: build-ios

# 手动触发（push 触发会被新账号风控取消，故只用手动）
on:
  workflow_dispatch:

jobs:
  build:
    # Intel 机型标签；arm64 的 macos-14/macos-15 在当前账号下报
    # "configuration 'macos-14-arm64-us-default' is not supported"
    runs-on: macos-26-intel
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 生成 iOS 工程 + 挂原生桥 + 权限 + 图标
        run: bash scripts/prepare_ios.sh

      - name: 编译（免签名）
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 ipa
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry psc_app_unsigned.ipa Payload
          ls -lh psc_app_unsigned.ipa

      - name: 上传成品（在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: psc_app_unsigned_ipa
          path: psc_app_unsigned.ipa
          retention-days: 30
